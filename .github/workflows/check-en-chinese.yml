name: English Chinese Character Check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  check-en-chinese:
    name: English Chinese character check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Check English pages for Chinese characters
        run: npm run check:en-chinese -- --json --output

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: en-chinese-report
          path: docs/audits/en-chinese-report.json
